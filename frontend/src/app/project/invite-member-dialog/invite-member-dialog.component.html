<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-neutral-900">Inviter un membre</h2>
    <button (click)="onCancel()" class="p-2 hover:bg-neutral-100 rounded-lg transition-colors">
      <svg class="w-5 h-5 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Email</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <input 
          type="email" 
          [(ngModel)]="formData.email" 
          name="email"
          placeholder="email@example.com"
          class="w-full pl-10 pr-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
          [class.border-danger-500]="formErrors.email"
        />
      </div>
      @if (formErrors.email) {
        <p class="text-danger-600 text-sm mt-1">{{ formErrors.email }}</p>
      }
    </div>

    <!-- Permission -->
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Permission</label>
      <select 
        [(ngModel)]="formData.permission" 
        name="permission"
        class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white"
      >
        @for (permission of permissions; track permission.value) {
          <option [value]="permission.value">{{ permission.label }}</option>
        }
      </select>
      @if (formErrors.permission) {
        <p class="text-danger-600 text-sm mt-1">{{ formErrors.permission }}</p>
      }
    </div>

    @if (errorMessage) {
      <div class="bg-danger-50 border border-danger-200 rounded-lg p-4 text-danger-700 text-sm">
        {{ errorMessage }}
      </div>
    }

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-4">
      <button 
        type="button" 
        (click)="onCancel()"
        class="px-4 py-2 border border-neutral-300 text-neutral-700 rounded-lg hover:bg-neutral-50 transition-colors"
      >
        Annuler
      </button>
      <button 
        type="submit"
        [disabled]="isSubmitting || !formData.email || !formData.permission"
        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        @if (isSubmitting) {
          <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        }
        <span>{{ isSubmitting ? 'Invitation...' : 'Inviter' }}</span>
      </button>
    </div>
  </form>
</div>
