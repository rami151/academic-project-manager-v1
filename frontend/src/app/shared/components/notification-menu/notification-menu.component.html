<div class="relative">
  <button (click)="toggleMenu()" class="relative p-2 hover:bg-neutral-100 rounded-lg transition-colors">
    @if (unreadCount > 0) {
      <span class="absolute top-1 right-1 w-2 h-2 bg-danger-500 rounded-full"></span>
    }
    <svg class="w-6 h-6 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
  </button>

  @if (showMenu) {
    <div class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-neutral-200 overflow-hidden z-50">
      <div class="flex justify-between items-center px-4 py-3 border-b border-neutral-200">
        <span class="font-semibold text-neutral-900">Notifications</span>
        @if (unreadCount > 0) {
          <button (click)="markAllAsRead()" class="text-sm text-primary-600 hover:text-primary-700">
            Tout marquer comme lu
          </button>
        }
      </div>
      
      <div class="max-h-96 overflow-y-auto">
        @for (notification of notifications; track notification.id) {
          <div 
            class="flex items-start justify-between p-4 border-b border-neutral-100 hover:bg-neutral-50 cursor-pointer"
            [class.bg-primary-50]="!notification.isRead"
            (click)="onNotificationClick(notification)"
          >
            <div class="flex-1">
              <p class="text-sm text-neutral-900">{{ notification.message }}</p>
              <span class="text-xs text-neutral-500">{{ getRelativeTime(notification.createdAt) }}</span>
            </div>
            @if (!notification.isRead) {
              <button (click)="markAsRead(notification); $event.stopPropagation()" class="p-1 text-neutral-400 hover:text-primary-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </button>
            }
          </div>
        }
        
        @if (notifications.length === 0) {
          <div class="text-center py-8 text-neutral-500">
            <p>Aucune notification</p>
          </div>
        }
      </div>
    </div>
  }
</div>
