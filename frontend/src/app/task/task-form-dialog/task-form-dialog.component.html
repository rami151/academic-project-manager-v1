<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-neutral-900">Nouvelle Tâche</h2>
    <button (click)="onCancel()" class="p-2 hover:bg-neutral-100 rounded-lg transition-colors">
      <svg class="w-5 h-5 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Title -->
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Titre</label>
      <input 
        type="text" 
        [(ngModel)]="formData.title" 
        name="title"
        placeholder="Titre de la tâche"
        class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
        [class.border-danger-500]="formErrors.title"
      />
      @if (formErrors.title) {
        <p class="text-danger-600 text-sm mt-1">{{ formErrors.title }}</p>
      }
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Description</label>
      <textarea 
        [(ngModel)]="formData.description" 
        name="description"
        rows="3"
        placeholder="Description de la tâche"
        class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
      ></textarea>
    </div>

    <!-- Priority -->
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Priorité</label>
      <select 
        [(ngModel)]="formData.priority" 
        name="priority"
        class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white"
      >
        @for (p of priorities; track p.value) {
          <option [value]="p.value">{{ p.label }}</option>
        }
      </select>
    </div>

    <!-- Due Date -->
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Date d'échéance</label>
      <input 
        type="date" 
        [(ngModel)]="formData.dueDate" 
        name="dueDate"
        class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
      />
    </div>

    <!-- Estimated Days -->
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Jours estimés</label>
      <input 
        type="number" 
        [(ngModel)]="formData.estimatedDays" 
        name="estimatedDays"
        min="1"
        class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
      />
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-4">
      <button 
        type="button" 
        (click)="onCancel()"
        class="px-4 py-2 border border-neutral-300 text-neutral-700 rounded-lg hover:bg-neutral-50 transition-colors"
      >
        Annuler
      </button>
      <button 
        type="submit"
        [disabled]="loading || !formData.title"
        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        @if (loading) {
          <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        }
        <span>{{ loading ? 'Création...' : 'Créer' }}</span>
      </button>
    </div>
  </form>
</div>
