<div class="p-6 bg-gradient-to-br from-neutral-50 to-neutral-100 rounded-2xl border border-neutral-200 shadow-xl overflow-hidden relative">
  <!-- Decorative Background Blob -->
  <div class="absolute -top-24 -right-24 w-64 h-64 bg-primary-100/30 rounded-full blur-3xl z-[-10]"></div>
  <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-secondary-100/30 rounded-full blur-3xl z-[-10]"></div>

  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-neutral-900">Nouvelle Tâche</h2>
    <button (click)="onCancel()" class="p-2 hover:bg-neutral-100 rounded-lg transition-colors">
      <svg class="w-5 h-5 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <!-- Title -->
    <div>
      <label class="block text-sm font-semibold text-neutral-700 mb-2">Titre</label>
      <div class="relative group">
        <input 
          type="text" 
          [(ngModel)]="formData.title" 
          name="title"
          placeholder="Ex: Concevoir le schéma de la base de données"
          class="w-full pl-4 pr-10 py-3 bg-white/50 backdrop-blur-sm border border-neutral-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all shadow-sm group-hover:bg-white"
          [class.border-danger-500]="formErrors.title"
        />
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 group-hover:text-primary-500 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        </div>
      </div>
      @if (formErrors.title) {
        <p class="text-danger-600 text-xs mt-1.5 flex items-center gap-1 px-1">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          {{ formErrors.title }}
        </p>
      }
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-semibold text-neutral-700 mb-2">Description</label>
      <textarea 
        [(ngModel)]="formData.description" 
        name="description"
        rows="3"
        placeholder="Détaillez les objectifs de cette tâche..."
        class="w-full px-4 py-3 bg-white/50 backdrop-blur-sm border border-neutral-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all shadow-sm hover:bg-white resize-none"
      ></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <!-- Priority -->
      <div>
        <label class="block text-sm font-semibold text-neutral-700 mb-2">Priorité</label>
        <select 
          [(ngModel)]="formData.priority" 
          name="priority"
          class="w-full px-4 py-3 bg-white/50 backdrop-blur-sm border border-neutral-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all shadow-sm hover:bg-white cursor-pointer appearance-none"
        >
          @for (p of priorities; track p.value) {
            <option [value]="p.value">{{ p.label }}</option>
          }
        </select>
      </div>

      <!-- Due Date -->
      <div>
        <label class="block text-sm font-semibold text-neutral-700 mb-2">Date d'échéance</label>
        <input 
          type="date" 
          [(ngModel)]="formData.dueDate" 
          name="dueDate"
          class="w-full px-4 py-3 bg-white/50 backdrop-blur-sm border border-neutral-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all shadow-sm hover:bg-white"
        />
      </div>
    </div>

    <!-- Estimated Days -->
    <div>
      <label class="block text-sm font-semibold text-neutral-700 mb-2">Jours estimés</label>
      <div class="relative group max-w-[150px]">
        <input 
          type="number" 
          [(ngModel)]="formData.estimatedDays" 
          name="estimatedDays"
          min="1"
          placeholder="0"
          class="w-full pl-4 pr-10 py-3 bg-white/50 backdrop-blur-sm border border-neutral-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all shadow-sm hover:bg-white"
        />
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-6 border-t border-neutral-200/50">
      <button 
        type="button" 
        (click)="onCancel()"
        class="px-6 py-2.5 text-sm font-semibold text-neutral-600 hover:text-neutral-900 hover:bg-white rounded-xl transition-all"
      >
        Annuler
      </button>
      <button 
        type="submit"
        [disabled]="loading || !formData.title"
        class="px-8 py-2.5 bg-gradient-to-r from-primary-600 to-primary-500 text-white text-sm font-bold rounded-xl hover:shadow-lg hover:shadow-primary-200 hover:-translate-y-0.5 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        @if (loading) {
          <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        }
        <span>{{ loading ? 'Création...' : 'Créer la tâche' }}</span>
      </button>
    </div>
  </form>
</div>
