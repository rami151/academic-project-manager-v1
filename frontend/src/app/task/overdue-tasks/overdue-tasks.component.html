<div class="min-h-screen bg-neutral-50 p-6">
  <div class="max-w-5xl mx-auto">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-neutral-900">Tâches en retard</h1>
      <p class="text-neutral-600">Suivi des tâches dont la date limite est dépassée.</p>
    </div>

    @if (loading) {
      <div class="text-center py-12 text-neutral-500">Chargement...</div>
    }

    @if (error) {
      <div class="bg-danger-50 border border-danger-200 rounded-lg p-4 text-danger-700">{{ error }}</div>
    }

    @if (!loading && !error) {
      <div class="space-y-3">
        @for (task of tasks; track task.id) {
          <app-task-card [task]="task"></app-task-card>
        }
      </div>

      @if (tasks.length === 0) {
        <div class="bg-white rounded-xl border border-neutral-200 p-8 text-center text-neutral-500">
          Aucune tâche en retard.
        </div>
      }
    }
  </div>
</div>
