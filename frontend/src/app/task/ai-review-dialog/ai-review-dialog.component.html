<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-neutral-900">Réviser les tâches générées</h2>
    <button (click)="onCancel()" class="p-2 hover:bg-neutral-100 rounded-lg transition-colors">
      <svg class="w-5 h-5 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  @if (loading) {
    <div class="flex flex-col items-center justify-center py-12">
      <div class="w-10 h-10 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin mb-4"></div>
      <p class="text-neutral-600">Chargement des tâches...</p>
    </div>
  }

  @if (!loading) {
    <!-- Actions Bar -->
    <div class="flex items-center justify-between mb-4">
      <label class="flex items-center gap-2 cursor-pointer">
        <input 
          type="checkbox" 
          [checked]="allSelected" 
          (change)="toggleAll()"
          class="w-4 h-4 text-primary-600 border-neutral-300 rounded focus:ring-primary-500"
        />
        <span class="text-sm text-neutral-700">Tout sélectionner</span>
      </label>
      <span class="text-sm text-neutral-600">{{ tasks.length }} tâches</span>
    </div>

    <!-- Task List -->
    <div class="space-y-3 max-h-96 overflow-y-auto mb-4">
      @for (task of tasks; track $index) {
        <div class="flex items-center gap-3 p-3 bg-neutral-50 rounded-lg border border-neutral-200">
          <div class="cursor-move text-neutral-400 hover:text-neutral-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/>
            </svg>
          </div>
          
          <input 
            type="checkbox" 
            [(ngModel)]="task.selected"
            class="w-4 h-4 text-primary-600 border-neutral-300 rounded focus:ring-primary-500"
          />
          
          <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3">
            <input 
              type="text" 
              [(ngModel)]="task.title" 
              placeholder="Titre"
              class="px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
            />
            
            <select 
              [(ngModel)]="task.priority"
              class="px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white"
            >
              <option value="HIGH">Haute</option>
              <option value="MEDIUM">Moyenne</option>
              <option value="LOW">Basse</option>
            </select>
            
            <div class="flex items-center gap-2">
              <input 
                type="number" 
                [(ngModel)]="task.estimatedDays" 
                min="1"
                class="w-20 px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
              />
              <span class="text-sm text-neutral-600">jours</span>
            </div>
          </div>

          <button (click)="removeTask($index)" class="p-2 text-neutral-400 hover:text-danger-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>
        </div>
      }
    </div>

    @if (error) {
      <div class="bg-danger-50 border border-danger-200 rounded-lg p-4 text-danger-700 text-sm mb-4">
        {{ error }}
      </div>
    }

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-4">
      <button 
        type="button" 
        (click)="onCancel()"
        class="px-4 py-2 border border-neutral-300 text-neutral-700 rounded-lg hover:bg-neutral-50 transition-colors"
      >
        Fermer
      </button>
      <button 
        type="button"
        [disabled]="importing || tasks.length === 0"
        (click)="importSelected()"
        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        @if (importing) {
          <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        }
        <span>{{ importing ? 'Importation...' : 'Importer la sélection' }}</span>
      </button>
    </div>
  }
</div>
