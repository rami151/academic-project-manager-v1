<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-neutral-900">Générer des tâches avec IA</h2>
    <button (click)="onCancel()" class="p-2 hover:bg-neutral-100 rounded-lg transition-colors">
      <svg class="w-5 h-5 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <p class="text-neutral-600 mb-4">
    Décrivez votre projet en quelques phrases. L'IA générera des tâches détaillées et réalistes.
  </p>

  <form (ngSubmit)="generate()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-neutral-900 mb-2">Description du projet</label>
      <textarea 
        [(ngModel)]="description" 
        name="description"
        rows="5"
        placeholder="Décrivez votre projet en détail..."
        class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
        [class.border-danger-500]="formErrors.description"
      ></textarea>
      <p class="text-xs text-neutral-500 mt-1">Minimum 20 caractères</p>
      @if (formErrors.description) {
        <p class="text-danger-600 text-sm mt-1">{{ formErrors.description }}</p>
      }
    </div>

    @if (error) {
      <div class="bg-danger-50 border border-danger-200 rounded-lg p-4 text-danger-700 text-sm">
        {{ error }}
      </div>
    }

    <div class="flex justify-end gap-3 pt-4">
      <button 
        type="button" 
        (click)="onCancel()"
        class="px-4 py-2 border border-neutral-300 text-neutral-700 rounded-lg hover:bg-neutral-50 transition-colors"
      >
        Annuler
      </button>
      <button 
        type="button"
        [disabled]="loading || description.length < 20"
        (click)="generate()"
        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        @if (loading) {
          <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        }
        <span>{{ loading ? 'Génération...' : 'Générer avec IA' }}</span>
      </button>
    </div>
  </form>
</div>
